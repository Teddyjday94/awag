<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071f4a">
  <title>Lead Board | Ascension Wash N' Geaux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f8fe; --surface: #fff; --surface-2: #eaf3fd; --ink: #10223e; --muted: #596981; --line: #d8e5f3;
      --navy: #0b2e6b; --accent: #1474e4; --accent-ink: #fff;
      --coral: #d94a2b; --coral-bg: #ffece6; --amber: #a86400; --amber-bg: #fff3dc; --green: #12804f; --green-bg: #e1f5eb; --slate-bg: #e9eef5;
      --shadow: 0 18px 40px -24px rgba(5, 38, 89, .45); --scrim: rgba(6, 27, 62, .45);
      --display: "Anton", Impact, "Arial Narrow", sans-serif; --body: "Plus Jakarta Sans", system-ui, Arial, sans-serif; --r: 12px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07152d; --surface: #0d2142; --surface-2: #122b54; --ink: #e8f0fb; --muted: #9fb2cc; --line: #1f3a66;
        --navy: #cfe3ff; --accent: #4aa8ff; --accent-ink: #04122a;
        --coral: #ff8a6e; --coral-bg: #3a1a14; --amber: #ffc56b; --amber-bg: #33260c; --green: #5fd49c; --green-bg: #0f3324; --slate-bg: #172b4a;
        --shadow: 0 18px 40px -24px rgba(0, 0, 0, .8); --scrim: rgba(0, 0, 0, .6);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; padding-top: env(safe-area-inset-top, 0px); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .num { font-variant-numeric: tabular-nums; }
    .wrap { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 48px; display: grid; gap: 18px; }

    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 48px; height: 48px; border-radius: 10px; flex: none; }
    .brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; letter-spacing: .01em; line-height: 1; color: var(--navy); }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .who { color: var(--muted); font-size: 12px; }
    .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 13px; }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }

    .gate { width: 100%; max-width: 420px; margin: 8vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; text-align: center; }
    .gate img { width: 88px; height: 88px; border-radius: 14px; margin: 0 auto; }
    .gate h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--navy); }
    .gate p { margin: 0; color: var(--muted); }
    .gate form { display: grid; gap: 10px; text-align: left; }
    .msg { font-weight: 700; min-height: 1.2em; margin: 0; }
    .msg.err { color: var(--coral); }
    .msg.ok { color: var(--green); }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
    .stat .label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .stat .value { font-family: var(--display); font-size: 32px; line-height: 1.1; color: var(--navy); font-variant-numeric: tabular-nums; }
    .stat .sub { font-size: 12px; color: var(--muted); }
    @media (max-width: 820px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .today { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 800; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .todo-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .todo { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); text-align: left; max-width: 100%; }
    .todo:hover { border-color: var(--accent); }
    .todo small { color: var(--muted); display: block; font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; margin: 0; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field-inline { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; max-width: 100%; }
    .field-inline input, .field-inline select { border: 0; background: transparent; padding: 5px 4px; outline: none; min-width: 0; }
    .field-inline input { width: 220px; max-width: 52vw; }
    .field-inline label { font-size: 12px; font-weight: 700; color: var(--muted); }

    .board-scroll { overflow-x: auto; padding-bottom: 6px; }
    .board { display: grid; grid-template-columns: repeat(6, minmax(232px, 1fr)); gap: 12px; min-width: min-content; }
    .col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 4px; }
    .col-head h3 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
    .col-head h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); display: inline-block; }
    .col-head .count { font-size: 12px; color: var(--muted); font-weight: 700; }
    .col-total { font-size: 12px; color: var(--muted); padding: 0 4px; margin-top: -6px; }
    .col.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: grid; gap: 6px; text-align: left; width: 100%; transition: box-shadow .15s, border-color .15s; }
    .card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .card.flag-late { border-left: 4px solid var(--coral); }
    .card.flag-soon { border-left: 4px solid var(--amber); }
    .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card .name { font-weight: 800; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
    .card .amt { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--navy); white-space: nowrap; }
    .card .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
    .chip-late { color: var(--coral); background: var(--coral-bg); }
    .chip-soon { color: var(--amber); background: var(--amber-bg); }
    .chip-ok { color: var(--green); background: var(--green-bg); }
    .chip-plain { color: var(--muted); background: var(--slate-bg); }
    .col-empty { font-size: 12px; color: var(--muted); padding: 10px 4px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

    .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
    .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sheet-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
    .sheet-head .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
    .sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .x { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; line-height: 1; flex: none; }
    .stages { display: flex; flex-wrap: wrap; gap: 6px; }
    .stage-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; }
    .stage-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .sheet-body { overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 18px; align-content: start; }
    .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
    .kv dt { color: var(--muted); font-size: 12px; font-weight: 700; padding-top: 1px; }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .kv a { color: var(--accent); font-weight: 700; }
    .quote { margin: 0; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; }
    .quote small { display: block; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; white-space: normal; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .f { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .f input, .f select, .f textarea { font-weight: 500; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
    .h3 { margin: 0 0 8px; font-size: 13px; font-weight: 800; }
    .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .log li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; font-size: 13px; }
    .log li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
    .log li.sys::before { background: var(--line); }
    .log time { display: block; font-size: 11px; color: var(--muted); }
    .note-add { display: flex; gap: 8px; margin-top: 10px; }
    .note-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; }

    .modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; }
    .modal h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 30; }
    @media (max-width: 520px) {
      .wrap { padding-inline: 16px; }
      .grid2 { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 80px minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <!-- Sign-in -->
  <main class="wrap" id="gate" hidden>
    <div class="gate">
      <img src="assets/images/logo.jpg" alt="Ascension Wash N' Geaux logo">
      <h1>Lead Board</h1>
      <p id="gate-text">Sign in with your email and password.</p>
      <form id="login-form">
        <label class="f">Email<input id="login-email" type="email" autocomplete="username" required placeholder="you@email.com"></label>
        <label class="f">Password<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
        <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
        <button class="linkbtn" type="button" id="to-link">First time here, or forgot your password?</button>
      </form>
      <form id="link-form" hidden>
        <label class="f">Email<input id="link-email" type="email" autocomplete="email" required placeholder="you@email.com"></label>
        <button class="btn btn-primary" type="submit" id="link-btn">Email me a link to set my password</button>
        <p class="msg" id="link-msg" role="status" aria-live="polite"></p>
        <button class="linkbtn" type="button" id="to-login">Back to sign in</button>
      </form>
      <form id="pw-form" hidden>
        <input type="email" id="pw-user" autocomplete="username" hidden>
        <label class="f">New password<input id="pw-new" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="f">Type it again<input id="pw-again" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn btn-primary" type="submit" id="pw-btn">Save password</button>
        <p class="msg" id="pw-msg" role="status" aria-live="polite"></p>
        <button class="linkbtn" type="button" id="pw-cancel" hidden>Cancel</button>
      </form>
      <button class="linkbtn" type="button" id="gate-signout" hidden>Sign out</button>
    </div>
  </main>

  <!-- Board -->
  <main class="wrap" id="app" hidden>
    <header class="top">
      <div class="brand">
        <img src="assets/images/logo.jpg" alt="">
        <div><h1>Lead Board</h1><p>Ascension Wash N' Geaux · quote requests to finished jobs</p></div>
      </div>
      <div class="actions">
        <span class="who" id="who"></span>
        <button class="btn btn-primary" id="btn-new" type="button">+ New lead</button>
        <button class="btn" id="btn-password" type="button">Change password</button>
        <button class="btn" id="btn-signout" type="button">Sign out</button>
      </div>
    </header>

    <section class="stats" aria-label="At a glance">
      <div class="stat"><span class="label">New requests · 7 days</span><span class="value" id="s-new">0</span><span class="sub" id="s-new-sub"></span></div>
      <div class="stat"><span class="label">Quotes out</span><span class="value" id="s-quoted">$0</span><span class="sub" id="s-quoted-sub"></span></div>
      <div class="stat"><span class="label">Booked work</span><span class="value" id="s-booked">$0</span><span class="sub" id="s-booked-sub"></span></div>
      <div class="stat"><span class="label">Close rate</span><span class="value" id="s-win">—</span><span class="sub" id="s-win-sub"></span></div>
    </section>

    <section class="today" aria-labelledby="today-h">
      <div class="section-head">
        <h2 id="today-h">Call back today</h2>
        <span>The site promises same-day answers. Anything waiting over 24 hours turns red.</span>
      </div>
      <ul class="todo-list" id="todo"></ul>
    </section>

    <div class="toolbar">
      <div class="field-inline"><label for="q">Search</label><input id="q" type="search" placeholder="Name, town, phone…"></div>
      <div class="field-inline"><label for="fsvc">Service</label><select id="fsvc"><option value="">All services</option></select></div>
      <div class="field-inline"><label for="fsrc">Came from</label><select id="fsrc"><option value="">Anywhere</option></select></div>
    </div>

    <div class="board-scroll"><div class="board" id="board"></div></div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" hidden role="dialog" aria-labelledby="d-name"></aside>

  <form class="modal" id="new-form" hidden role="dialog" aria-labelledby="new-h" novalidate>
    <h2 id="new-h">New lead</h2>
    <div class="grid2">
      <label class="f">Name<input id="n-name" name="name" autocomplete="off" placeholder="Customer name"></label>
      <label class="f">Phone<input id="n-phone" name="phone" type="tel" placeholder="(225) 555-0100"></label>
    </div>
    <label class="f">Email<input id="n-email" name="email" type="email" placeholder="optional"></label>
    <label class="f">Property address / area<input id="n-address" name="address" placeholder="Street, city"></label>
    <div class="grid2">
      <label class="f">What needs cleaning?<select id="n-service" name="service"></select></label>
      <label class="f">Came from<select id="n-source" name="source"></select></label>
    </div>
    <label class="f">Notes from the customer<textarea id="n-message" name="message" rows="3" placeholder="Square footage, stains, timeline…"></textarea></label>
    <p class="msg err" id="n-err" role="status"></p>
    <div class="modal-actions">
      <button class="btn" type="button" id="n-cancel">Cancel</button>
      <button class="btn btn-primary" type="submit" id="n-save">Add to board</button>
    </div>
  </form>

  <div class="toast" id="toast" hidden role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { CRM_URL, CRM_KEY } from './crm-config.mjs';

    const STAGES = [
      { id: 'new', label: 'New request', dot: 'var(--accent)' },
      { id: 'contacted', label: 'Talked to', dot: '#7aa7d9' },
      { id: 'quoted', label: 'Estimate sent', dot: 'var(--amber)' },
      { id: 'booked', label: 'Booked', dot: 'var(--green)' },
      { id: 'done', label: 'Done & paid', dot: 'var(--navy)' },
      { id: 'lost', label: 'Didn’t go', dot: 'var(--muted)' },
    ];
    const SERVICES = ['Roof soft washing', 'House / siding washing', 'Driveway or sidewalk', 'Fence or deck', 'Commercial property', 'Not sure, need advice'];
    const SOURCES = ['Website quote form', 'Phone call', 'Text', 'Facebook', 'Referral', 'Yard sign', 'Other'];
    const H = 3600e3, D = 24 * H;

    // Read before the client consumes it: arriving from an emailed link means "set your password".
    const cameFromEmailLink = /[#&](access_token|error_description)=/.test(location.hash) || new URLSearchParams(location.search).has('code');
    const sb = window.supabase.createClient(CRM_URL, CRM_KEY);
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
    const isoDay = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const dayDiff = (iso) => iso ? Math.round((new Date(iso + 'T00:00:00') - new Date(isoDay(new Date()) + 'T00:00:00')) / D) : null;
    const ts = (s) => Date.parse(s);
    const ago = (t) => { const m = (Date.now() - t) / 60000; if (m < 60) return Math.max(1, Math.round(m)) + ' min ago'; const h = m / 60; if (h < 24) return Math.round(h) + ' hr ago'; const d = Math.round(h / 24); return d + (d === 1 ? ' day ago' : ' days ago'); };
    const when = (iso) => { const n = dayDiff(iso); if (n === null) return ''; if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
    const stageOf = (id) => STAGES.find((s) => s.id === id);
    const telHref = (p) => 'tel:' + String(p).replace(/[^\d+]/g, '');

    let leads = [];
    let openId = null;
    let openNotes = [];
    let channel = null;

    let toastTimer;
    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600); }
    function fail(error, what) { console.error(error); toast(what + ' didn’t save. Check your connection and try again.'); }

    // ---------- Sign-in ----------
    // Staff sign in with email + password. The emailed link is only for setting
    // a password the first time, or resetting a forgotten one.
    let mustSetPassword = cameFromEmailLink;
    let boardReady = false;
    const say = (el, text, kind = '') => { el.className = 'msg' + (kind ? ' ' + kind : ''); el.textContent = text; };

    function showForm(id) {
      ['login-form', 'link-form', 'pw-form'].forEach((f) => ($('#' + f).hidden = f !== id));
      $('#gate-signout').hidden = id !== 'pw-form' || boardReady;
      $('#pw-cancel').hidden = !boardReady;
    }

    function showGate(text, { signedIn = false } = {}) {
      $('#app').hidden = true; $('#gate').hidden = false;
      $('#gate-text').textContent = text;
      if (signedIn) { showForm(null); $('#gate-signout').hidden = false; } else showForm('login-form');
    }

    function showPasswordForm(email, text) {
      $('#app').hidden = true; $('#gate').hidden = false;
      $('#gate-text').textContent = text;
      $('#pw-form').reset(); $('#pw-user').value = email; say($('#pw-msg'), '');
      showForm('pw-form');
      $('#pw-new').focus();
    }

    $('#to-link').addEventListener('click', () => {
      $('#link-email').value = $('#login-email').value.trim();
      say($('#link-msg'), '');
      $('#gate-text').textContent = 'We’ll email you a link. Open it on this device and you’ll be asked to choose a password.';
      showForm('link-form');
      $('#link-email').focus();
    });
    $('#to-login').addEventListener('click', () => { $('#gate-text').textContent = 'Sign in with your email and password.'; showForm('login-form'); });

    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#login-email').value.trim().toLowerCase();
      const password = $('#login-password').value;
      const msg = $('#login-msg'), btn = $('#login-btn');
      if (!email || !password) return say(msg, 'Enter your email and password.', 'err');
      btn.disabled = true; say(msg, 'Signing in…');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      if (error) {
        const bad = /invalid login credentials/i.test(error.message || '');
        return say(msg, bad ? 'That email and password don’t match. If you haven’t set a password yet, use the link below.' : (error.message || 'Sign-in failed. Try again in a minute.'), 'err');
      }
      say(msg, '');
      start(data.session);
    });

    $('#link-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#link-email').value.trim().toLowerCase();
      const msg = $('#link-msg'), btn = $('#link-btn');
      if (!email) return say(msg, 'Enter your email address.', 'err');
      btn.disabled = true; say(msg, 'Sending…');
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      btn.disabled = false;
      if (error) return say(msg, error.message || 'The link could not be sent. Try again in a minute.', 'err');
      say(msg, 'Check your email for the link. You can close this tab.', 'ok');
    });

    $('#pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('#pw-new').value, again = $('#pw-again').value;
      const msg = $('#pw-msg'), btn = $('#pw-btn');
      if (pw.length < 8) return say(msg, 'Use at least 8 characters.', 'err');
      if (pw !== again) return say(msg, 'The two passwords don’t match.', 'err');
      btn.disabled = true; say(msg, 'Saving…');
      const { error } = await sb.auth.updateUser({ password: pw });
      btn.disabled = false;
      if (error) return say(msg, error.message || 'The password didn’t save. Try again.', 'err');
      mustSetPassword = false;
      if (boardReady) { $('#gate').hidden = true; $('#app').hidden = false; toast('Password saved'); return; }
      const { data } = await sb.auth.getSession();
      start(data.session, { justSetPassword: true });
    });

    $('#pw-cancel').addEventListener('click', () => { $('#gate').hidden = true; $('#app').hidden = false; });
    $('#btn-password').addEventListener('click', () => showPasswordForm($('#who').textContent, 'Choose a new password for the Lead Board.'));

    const signOut = async () => { await sb.auth.signOut(); location.replace(location.pathname); };
    $('#btn-signout').addEventListener('click', signOut);
    $('#gate-signout').addEventListener('click', signOut);

    async function start(session, { justSetPassword = false } = {}) {
      if (!session) return showGate('Sign in with your email and password.');
      const email = session.user.email;
      const { data: staff, error } = await sb.from('staff').select('email').limit(1);
      if (error || !staff?.length) {
        return showGate(`${email} isn’t on the staff list for this board. Ask the owner to add it.`, { signedIn: true });
      }
      if (mustSetPassword) return showPasswordForm(email, 'Choose a password. Next time, sign in with your email and this password.');
      $('#gate').hidden = true; $('#app').hidden = false;
      $('#who').textContent = email;
      boardReady = true;
      if (justSetPassword) toast('Password saved. Use it to sign in next time.');
      await loadLeads();
      subscribe();
    }

    let started = false;
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'INITIAL_SESSION' || (event === 'SIGNED_IN' && !started)) {
        started = true;
        start(session);
      }
    });

    // ---------- Data ----------
    async function loadLeads() {
      const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false });
      if (error) return fail(error, 'Loading leads');
      leads = data;
      renderAll();
    }

    async function loadNotes(id) {
      const { data, error } = await sb.from('lead_notes').select('*').eq('lead_id', id).order('created_at', { ascending: false });
      if (error) return fail(error, 'Loading notes');
      if (openId === id) { openNotes = data; renderSheet(); }
    }

    function subscribe() {
      if (channel) return;
      channel = sb.channel('crm')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, (p) => {
          if (p.eventType === 'INSERT' && !leads.some((l) => l.id === p.new.id)) {
            leads.unshift(p.new);
            if (p.new.source === 'Website quote form') toast('New quote request from ' + p.new.name);
          } else if (p.eventType === 'UPDATE') {
            leads = leads.map((l) => (l.id === p.new.id ? p.new : l));
          } else if (p.eventType === 'DELETE') {
            leads = leads.filter((l) => l.id !== p.old.id);
          }
          renderAll();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'lead_notes' }, (p) => {
          const id = p.new?.lead_id || p.old?.lead_id;
          if (openId && (!id || id === openId)) loadNotes(openId);
        })
        .subscribe();
    }

    async function updateLead(id, patch) {
      const before = leads.find((l) => l.id === id);
      leads = leads.map((l) => (l.id === id ? { ...l, ...patch } : l));
      renderAll();
      const { data, error } = await sb.from('leads').update(patch).eq('id', id).select().single();
      if (error) { leads = leads.map((l) => (l.id === id ? before : l)); renderAll(); return fail(error, 'That change'); }
      leads = leads.map((l) => (l.id === id ? data : l));
      renderAll();
      return data;
    }

    async function addNote(id, body, kind = 'note') {
      const { error } = await sb.from('lead_notes').insert({ lead_id: id, body, kind });
      if (error) return fail(error, 'The note');
      if (openId === id) loadNotes(id);
    }

    async function moveTo(id, stage) {
      const l = leads.find((x) => x.id === id);
      if (!l || l.stage === stage) return;
      const patch = { stage };
      if (stage === 'booked' && !l.job_date) patch.job_date = isoDay(new Date(Date.now() + 3 * D));
      const saved = await updateLead(id, patch);
      if (!saved) return;
      addNote(id, 'Moved to ' + stageOf(stage).label, 'stage');
      toast(l.name + ' moved to ' + stageOf(stage).label);
    }

    // ---------- Board ----------
    function flag(l) {
      if (l.stage === 'new') {
        const h = (Date.now() - ts(l.created_at)) / H;
        if (h >= 24) return { level: 'late', text: 'No reply in ' + Math.floor(h / 24) + 'd' };
        if (h >= 4) return { level: 'soon', text: 'Reply today' };
        return { level: 'ok', text: 'Just in' };
      }
      if ((l.stage === 'contacted' || l.stage === 'quoted') && l.follow_up) {
        const n = dayDiff(l.follow_up);
        if (n < 0) return { level: 'late', text: 'Follow-up overdue' };
        if (n === 0) return { level: 'soon', text: 'Follow up today' };
        return { level: 'plain', text: 'Follow up ' + when(l.follow_up) };
      }
      if (l.stage === 'booked' && l.job_date) {
        const n = dayDiff(l.job_date);
        return { level: n <= 1 ? 'soon' : 'ok', text: 'Job ' + when(l.job_date) };
      }
      return null;
    }

    const fsvc = $('#fsvc'), fsrc = $('#fsrc'), q = $('#q');
    SERVICES.forEach((s) => fsvc.add(new Option(s, s)));
    SOURCES.forEach((s) => fsrc.add(new Option(s, s)));
    [fsvc, fsrc].forEach((el) => el.addEventListener('change', renderBoard));
    q.addEventListener('input', renderBoard);
    function visible(l) {
      if (fsvc.value && l.service !== fsvc.value) return false;
      if (fsrc.value && l.source !== fsrc.value) return false;
      const t = q.value.trim().toLowerCase();
      return !t || [l.name, l.address, l.phone, l.email, l.message].join(' ').toLowerCase().includes(t);
    }

    function renderStats() {
      const sum = (list) => list.reduce((a, l) => a + (Number(l.estimate) || 0), 0);
      const week = leads.filter((l) => Date.now() - ts(l.created_at) < 7 * D);
      $('#s-new').textContent = week.length;
      $('#s-new-sub').textContent = week.filter((l) => l.source === 'Website quote form').length + ' from the website form';
      const quoted = leads.filter((l) => l.stage === 'quoted');
      $('#s-quoted').textContent = money(sum(quoted));
      $('#s-quoted-sub').textContent = quoted.length + (quoted.length === 1 ? ' estimate' : ' estimates') + ' waiting on a yes';
      const booked = leads.filter((l) => l.stage === 'booked'), done = leads.filter((l) => l.stage === 'done');
      $('#s-booked').textContent = money(sum(booked));
      $('#s-booked-sub').textContent = booked.length + ' on the calendar · ' + money(sum(done)) + ' finished';
      const won = booked.length + done.length, lost = leads.filter((l) => l.stage === 'lost').length;
      $('#s-win').textContent = won + lost ? Math.round((won / (won + lost)) * 100) + '%' : '—';
      $('#s-win-sub').textContent = won + ' won · ' + lost + ' lost';
    }

    function renderTodo() {
      const items = leads.map((l) => ({ l, f: flag(l) }))
        .filter(({ l, f }) => f && (f.level === 'late' || f.level === 'soon') && l.stage !== 'booked')
        .sort((a, b) => (a.f.level === 'late' ? 0 : 1) - (b.f.level === 'late' ? 0 : 1));
      $('#todo').innerHTML = items.length
        ? items.map(({ l, f }) => `<li><button class="todo" type="button" data-open="${l.id}">
            <span class="chip chip-${f.level}">${esc(f.text)}</span>
            <span><b>${esc(l.name)}</b><small>${esc(l.service)} · <span class="num">${esc(l.phone)}</span></small></span></button></li>`).join('')
        : `<li><p class="empty">${leads.length ? 'Nobody waiting. Everyone has been called back.' : 'No leads yet. Quote requests from the website will show up here automatically.'}</p></li>`;
    }

    function renderBoard() {
      $('#board').innerHTML = STAGES.map((s) => {
        const list = leads.filter((l) => l.stage === s.id && visible(l)).sort((a, b) => ts(b.created_at) - ts(a.created_at));
        const total = list.reduce((a, l) => a + (Number(l.estimate) || 0), 0);
        const cards = list.map((l) => {
          const f = flag(l);
          const town = (l.address || '').split(',').pop().trim();
          return `<button class="card${f?.level === 'late' ? ' flag-late' : f?.level === 'soon' ? ' flag-soon' : ''}" type="button" data-open="${l.id}" draggable="true" data-id="${l.id}">
            <span class="row"><span class="name">${esc(l.name)}</span>${l.estimate != null ? `<span class="amt">${money(l.estimate)}</span>` : ''}</span>
            <span>${esc(l.service)}</span>
            <span class="meta">${town ? `<span>${esc(town)}</span>` : ''}<span>${esc(l.source)}</span><span>${ago(ts(l.created_at))}</span></span>
            ${f ? `<span><span class="chip chip-${f.level}">${esc(f.text)}</span></span>` : l.lost_reason ? `<span><span class="chip chip-plain">${esc(l.lost_reason)}</span></span>` : ''}
          </button>`;
        }).join('');
        return `<section class="col" data-stage="${s.id}" style="--dot:${s.dot}" aria-label="${esc(s.label)}">
          <div class="col-head"><h3><i></i>${esc(s.label)}</h3><span class="count num">${list.length}</span></div>
          ${total ? `<div class="col-total num">${money(total)}</div>` : ''}
          ${cards || '<div class="col-empty">Nothing here</div>'}
        </section>`;
      }).join('');
    }

    function renderAll() { renderStats(); renderTodo(); renderBoard(); if (openId) renderSheet(); }

    // Drag cards between columns
    let dragId = null;
    const clearDrop = () => document.querySelectorAll('.drop-target').forEach((n) => n.classList.remove('drop-target'));
    document.addEventListener('dragstart', (e) => { const c = e.target.closest?.('.card'); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; } });
    document.addEventListener('dragover', (e) => { const col = e.target.closest?.('.col'); if (col && dragId) { e.preventDefault(); clearDrop(); col.classList.add('drop-target'); } });
    document.addEventListener('drop', (e) => { const col = e.target.closest?.('.col'); if (col && dragId) { e.preventDefault(); moveTo(dragId, col.dataset.stage); } dragId = null; clearDrop(); });
    document.addEventListener('dragend', () => { dragId = null; clearDrop(); });

    // ---------- Lead sheet ----------
    const sheet = $('#sheet'), scrim = $('#scrim');
    function openSheet(id) { openId = id; openNotes = []; renderSheet(); sheet.hidden = false; scrim.hidden = false; sheet.querySelector('.x').focus(); loadNotes(id); }
    function closeAll() { openId = null; sheet.hidden = true; $('#new-form').hidden = true; scrim.hidden = true; }
    scrim.addEventListener('click', closeAll);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b) openSheet(b.dataset.open); });

    function renderSheet() {
      const l = leads.find((x) => x.id === openId);
      if (!l) return closeAll();
      // Keep a half-typed note across live refreshes
      const draft = sheet.querySelector('#d-note')?.value || '';
      const hadFocus = document.activeElement?.id === 'd-note';
      const f = flag(l);
      const dateField = l.stage === 'booked' || l.stage === 'done'
        ? `<label class="f">Job date<input id="d-job" type="date" value="${esc(l.job_date || '')}"></label>`
        : l.stage === 'lost'
          ? `<label class="f">Why it didn't go<input id="d-lost" value="${esc(l.lost_reason || '')}" placeholder="Price, timing…" maxlength="300"></label>`
          : `<label class="f">Follow up on<input id="d-fu" type="date" value="${esc(l.follow_up || '')}"></label>`;
      sheet.innerHTML = `
        <div class="sheet-head">
          <div class="row"><div><h2 id="d-name">${esc(l.name)}</h2><p>${esc(l.service)} · came in ${ago(ts(l.created_at))} by ${esc(l.source.toLowerCase())}</p></div>
            <button class="x" type="button" aria-label="Close">×</button></div>
          <div class="stages" role="group" aria-label="Stage">${STAGES.map((s) => `<button type="button" class="stage-btn" data-stage="${s.id}" aria-pressed="${l.stage === s.id}">${esc(s.label)}</button>`).join('')}</div>
          ${f ? `<div><span class="chip chip-${f.level}">${esc(f.text)}</span></div>` : ''}
        </div>
        <div class="sheet-body">
          <dl class="kv">
            <dt>Phone</dt><dd><a class="num" href="${esc(telHref(l.phone))}">${esc(l.phone)}</a> · <a href="sms:${esc(String(l.phone).replace(/[^\d+]/g, ''))}">Text</a></dd>
            <dt>Email</dt><dd>${l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : '<span style="color:var(--muted)">Not given</span>'}</dd>
            <dt>Address</dt><dd>${l.address ? `<a href="https://maps.google.com/?q=${encodeURIComponent(l.address)}" target="_blank" rel="noopener">${esc(l.address)}</a>` : '<span style="color:var(--muted)">Not given</span>'}</dd>
            <dt>Came from</dt><dd>${esc(l.source)}</dd>
          </dl>
          ${l.message ? `<p class="quote"><small>${l.source === 'Website quote form' ? 'From the website form' : 'What they asked for'}</small>${esc(l.message)}</p>` : ''}
          <div class="grid2">
            <label class="f">Estimate ($)<input id="d-est" type="number" min="0" step="5" inputmode="numeric" value="${l.estimate ?? ''}" placeholder="0"></label>
            ${dateField}
          </div>
          <div>
            <h3 class="h3">Notes &amp; history</h3>
            <ul class="log">
              ${openNotes.map((n) => `<li class="${n.kind === 'stage' ? 'sys' : ''}"><span>${esc(n.body)}<time>${ago(ts(n.created_at))}${n.author_email && n.kind === 'note' ? ' · ' + esc(n.author_email) : ''}</time></span></li>`).join('')}
              <li class="sys"><span>Lead created<time>${ago(ts(l.created_at))}</time></span></li>
            </ul>
            <form class="note-add" id="d-note-form"><input id="d-note" placeholder="Add a note: called, left voicemail…" aria-label="New note" maxlength="4000"><button class="btn btn-primary" type="submit">Add</button></form>
          </div>
          <div><button class="linkbtn" type="button" id="d-delete" style="color:var(--coral)">Delete this lead</button></div>
        </div>`;
      const noteInput = sheet.querySelector('#d-note');
      noteInput.value = draft;
      if (hadFocus) noteInput.focus();

      sheet.querySelector('.x').addEventListener('click', closeAll);
      sheet.querySelectorAll('.stage-btn').forEach((b) => b.addEventListener('click', () => moveTo(l.id, b.dataset.stage)));
      const bind = (sel, key, fmt) => { const el = sheet.querySelector(sel); if (el) el.addEventListener('change', () => updateLead(l.id, { [key]: fmt ? fmt(el.value) : (el.value || null) })); };
      bind('#d-est', 'estimate', (v) => (v === '' ? null : Math.max(0, Number(v))));
      bind('#d-job', 'job_date'); bind('#d-fu', 'follow_up'); bind('#d-lost', 'lost_reason');

      sheet.querySelector('#d-note-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const v = noteInput.value.trim();
        if (!v) return;
        noteInput.value = '';
        await addNote(l.id, v);
        if (l.stage === 'new') moveTo(l.id, 'contacted');
      });

      const del = sheet.querySelector('#d-delete');
      del.addEventListener('click', async () => {
        if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = 'Click again to delete for good'; return; }
        const { error } = await sb.from('leads').delete().eq('id', l.id);
        if (error) return fail(error, 'The delete');
        leads = leads.filter((x) => x.id !== l.id);
        closeAll(); renderAll(); toast('Lead deleted');
      });
    }

    // ---------- New lead ----------
    const nf = $('#new-form');
    SERVICES.forEach((s) => $('#n-service').add(new Option(s, s)));
    SOURCES.filter((s) => s !== 'Website quote form').forEach((s) => $('#n-source').add(new Option(s, s)));
    $('#btn-new').addEventListener('click', () => { nf.reset(); $('#n-err').textContent = ''; nf.hidden = false; scrim.hidden = false; $('#n-name').focus(); });
    $('#n-cancel').addEventListener('click', closeAll);
    nf.addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(nf).entries());
      if (!v.name.trim()) { $('#n-err').textContent = 'Add the customer’s name.'; return $('#n-name').focus(); }
      if (!v.phone.trim()) { $('#n-err').textContent = 'Add a phone number so you can call them back.'; return $('#n-phone').focus(); }
      $('#n-save').disabled = true;
      const { data, error } = await sb.from('leads').insert({
        name: v.name.trim(), phone: v.phone.trim(), email: v.email.trim() || null, address: v.address.trim() || null,
        service: v.service, source: v.source, message: v.message.trim() || null,
      }).select().single();
      $('#n-save').disabled = false;
      if (error) { $('#n-err').textContent = 'That lead didn’t save. Check your connection and try again.'; return console.error(error); }
      if (!leads.some((l) => l.id === data.id)) leads.unshift(data);
      closeAll(); renderAll(); toast(data.name + ' added to New request');
    });

    // Re-check "time since" labels every minute
    setInterval(() => { if (!$('#app').hidden) { renderStats(); renderTodo(); renderBoard(); } }, 60e3);
  </script>
</body>
</html>
